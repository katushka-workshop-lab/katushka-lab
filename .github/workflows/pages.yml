name: Test and publish KATUSHKA LAB with native Pages token
on:
  push:
    branches: [lab-candidate]
permissions:
  contents: read
concurrency:
  group: permanent-katushka-lab-pages
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'katushka-workshop-lab/katushka-lab' && github.ref == 'refs/heads/lab-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KATUSHKA_TEST_LAB: '1'
      KATUSHKA_TEST_PACKAGE: site
      KATUSHKA_TEST_OUTPUT: lab-browser-results
      KATUSHKA_PLAYWRIGHT_PATH: ${{ github.workspace }}/ci/node_modules/playwright
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ci/package-lock.json
      - run: node ci/verify.mjs
      - run: npm ci --prefix ci --ignore-scripts --no-audit --no-fund
      - name: Install test browsers
        run: |
          node ci/node_modules/playwright/cli.js install --with-deps chromium webkit
          echo "KATUSHKA_CHROMIUM_EXECUTABLE=$(node --input-type=module -e "import {chromium} from './ci/node_modules/playwright/index.mjs'; console.log(chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: node ci/check-ui.mjs
      - name: Prepare previous static release for update checks
        run: |
          if git cat-file -e HEAD^:site/index.html 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/lab-previous" HEAD^
            OLD_SITE="$RUNNER_TEMP/lab-previous/site" node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          for (const directory of ['_next/static','icons','images']) {
            await fs.cp(path.join('site',directory),path.join(process.env.OLD_SITE,directory),{recursive:true,force:false});
          }
          JS
            echo "KATUSHKA_TEST_PREVIOUS_PACKAGE=$RUNNER_TEMP/lab-previous/site" >> "$GITHUB_ENV"
          fi
      - name: Check durable winding drafts
        run: node ci/check-drafts.mjs
        env:
          KATUSHKA_TEST_OUTPUT: lab-draft-browser-results
      - name: Upload only the tested site directory
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site
  deploy:
    needs: verify
    if: github.repository == 'katushka-workshop-lab/katushka-lab' && github.ref == 'refs/heads/lab-candidate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
